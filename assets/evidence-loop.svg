<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="145" viewBox="0 0 1200 145" role="img" aria-labelledby="title desc">
  <title id="title">Evidence loop</title>
  <desc id="desc">Build, measure, replay, and claim form a continuous engineering loop.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e5ce"/><stop offset=".36" stop-color="#8b7cff"/><stop offset=".7" stop-color="#ff70ad"/><stop offset="1" stop-color="#ffc36f"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7186aa"/></marker>
  </defs>
  <rect width="1200" height="145" rx="20" fill="#0a1530"/>
  <path d="M240 72H370M520 72H650M800 72H930" stroke="#7186aa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1035 105C1010 137 190 137 165 105" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(80 38)"><rect width="160" height="68" rx="34" fill="#12394a" stroke="#43e5ce"/><text x="80" y="42" fill="#eafffb" font-size="19" font-weight="700">BUILD</text></g>
    <g transform="translate(360 38)"><rect width="160" height="68" rx="34" fill="#272657" stroke="#8b7cff"/><text x="80" y="42" fill="#f1efff" font-size="19" font-weight="700">MEASURE</text></g>
    <g transform="translate(640 38)"><rect width="160" height="68" rx="34" fill="#4a2344" stroke="#ff70ad"/><text x="80" y="42" fill="#fff0f7" font-size="19" font-weight="700">REPLAY</text></g>
    <g transform="translate(920 38)"><rect width="160" height="68" rx="34" fill="#4a3421" stroke="#ffc36f"/><text x="80" y="42" fill="#fff5e5" font-size="19" font-weight="700">CLAIM</text></g>
  </g>
</svg>
