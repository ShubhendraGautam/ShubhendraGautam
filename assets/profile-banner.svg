<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Shubhendra Gautam — Systems and ML Engineer</title>
  <desc id="desc">A colorful circuit-inspired banner connecting hardware, runtimes, machine learning, and reproducible research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09142f"/>
      <stop offset=".5" stop-color="#211744"/>
      <stop offset="1" stop-color="#0a3150"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e6cf"/>
      <stop offset=".5" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff6fae"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#6d5dfc" stop-opacity=".55"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#20d6c7" stop-opacity=".4"/><stop offset="1" stop-color="#20d6c7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a8c9ff" stroke-opacity=".07"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="80" r="260" fill="url(#glowA)"/>
  <circle cx="760" cy="370" r="280" fill="url(#glowB)"/>
  <path d="M0 342C210 292 382 390 620 330S988 248 1200 314V380H0Z" fill="#7c62ff" opacity=".08"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="70" y="76" fill="#50ead3" font-size="17" font-weight="700" letter-spacing="4">SYSTEMS × MACHINE LEARNING</text>
    <text x="68" y="145" fill="#fff" font-size="55" font-weight="750">Shubhendra Gautam</text>
    <rect x="70" y="169" width="500" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="218" fill="#dbe9ff" font-size="24">From logic gates to learning systems.</text>
    <text x="70" y="252" fill="#aebfdb" font-size="17">Hardware · runtimes · experiments · evidence</text>
    <g transform="translate(70 292)" font-size="14" font-weight="650">
      <g><rect width="137" height="38" rx="19" fill="#1e8c83" opacity=".42" stroke="#50ead3" stroke-opacity=".65"/><text x="68.5" y="24" text-anchor="middle" fill="#eafffb">RISC-V / FPGA</text></g>
      <g transform="translate(151)"><rect width="112" height="38" rx="19" fill="#634ed0" opacity=".45" stroke="#aa9cff" stroke-opacity=".7"/><text x="56" y="24" text-anchor="middle" fill="#f1eeff">C / PTX</text></g>
      <g transform="translate(277)"><rect width="132" height="38" rx="19" fill="#ad3d73" opacity=".38" stroke="#ff83b9" stroke-opacity=".7"/><text x="66" y="24" text-anchor="middle" fill="#fff0f7">Python / JS</text></g>
      <g transform="translate(423)"><rect width="132" height="38" rx="19" fill="#a5652a" opacity=".35" stroke="#ffc273" stroke-opacity=".7"/><text x="66" y="24" text-anchor="middle" fill="#fff4e5">Verification</text></g>
    </g>
  </g>
  <g transform="translate(815 68)" filter="url(#shadow)">
