    <rect x="92" y="80" width="133" height="133" rx="20" fill="#15294c" stroke="#8d9fff" stroke-opacity=".55"/>
    <path d="M112 112h92v70h-92zM128 98v28m30-28v28m30-28v28m-60 56v28m30-28v28m30-28v28" fill="none" stroke="#55e4d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M66 87H30m36 40H12m54 40H27m39 40H6m245-120h37m-37 40h56m-56 40h41m-41 40h62" fill="none" stroke="#9083ff" stroke-width="4" stroke-linecap="round"/>
    <g fill="#ff76ad"><circle cx="12" cy="127" r="7"/><circle cx="6" cy="207" r="7"/><circle cx="307" cy="127" r="7"/><circle cx="313" cy="207" r="7"/></g>
    <g fill="#54e7d1"><circle cx="30" cy="87" r="6"/><circle cx="27" cy="167" r="6"/><circle cx="288" cy="87" r="6"/><circle cx="292" cy="167" r="6"/></g>
    <text x="158" y="157" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">BUILD</text>
    <text x="158" y="183" text-anchor="middle" fill="#7ff3e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="3">VERIFY</text>
  </g>
